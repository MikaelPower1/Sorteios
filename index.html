<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MikaelPower CS2 Giveaways</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00ff88;
      --primary-glow: rgba(0, 255, 136, 0.25);
      --bg-dark: #07090e;
      --card-bg: #0f1520;
      --card-border: #1b263b;
      --text-muted: #8b9bb4;
      --rarity-cover: #eb4b4b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* Top Navigation Tabs */
    .nav-tabs {
      width: 100%;
      background: #0b0f17;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 12px 10px;
      overflow-x: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .nav-tab {
      padding: 10px 20px;
      background: #121927;
      border: 1px solid #202d44;
      border-radius: 6px;
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-tab:hover {
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .nav-tab.active {
      background: linear-gradient(180deg, rgba(0,255,136,0.15) 0%, rgba(15,21,32,1) 100%);
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .container { max-width: 1000px; width: 100%; padding: 30px 15px; }

    /* Main Skin Banner Card */
    .skin-banner-card {
      background: linear-gradient(145deg, #121a28 0%, #0a0e16 100%);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 25px;
      text-align: center;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

      position: absolute;
