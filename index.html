<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorteios MikaelPower</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0e14; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 900px; width: 100%; }
    
    /* Header & Banner */
    .header { text-align: center; margin-bottom: 25px; }
    .banner { width: 100%; height: 220px; background: linear-gradient(135deg, #1f293d, #111827); border-radius: 12px; border: 1px solid #2a364f; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .banner h1 { font-size: 2.2rem; color: #00ff88; text-transform: uppercase; letter-spacing: 2px; }
    .banner p { color: #9ca3af; margin-top: 8px; }

    /* Roleta Style CS2 */
    .roulette-section { margin: 30px 0; background: #131a26; padding: 20px; border-radius: 12px; border: 1px solid #2a364f; text-align: center; }
    .roulette-container { position: relative; width: 100%; height: 140px; overflow: hidden; background: #090d14; border-radius: 8px; border: 2px solid #1f293d; margin: 15px 0; }
    .roulette-track { display: flex; position: absolute; left: 0; top: 10px; transition: transform 5s cubic-bezier(0.15, 0.9, 0.2, 1); }
    .user-card { width: 120px; height: 120px; margin: 0 5px; background: #192231; border-radius: 8px; border: 1px solid #2e3d59; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
    .user-card img { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 8px; border: 2px solid #00ff88; }
    .user-card span { font-size: 0.8rem; font-weight: bold; color: #e5e7eb; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .pointer { position: absolute; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; z-index: 10; }
    .pointer-top { top: 0; border-top: 14px solid #00ff88; }
    .pointer-bottom { bottom: 0; border-bottom: 14px solid #00ff88; }

    .btn { background: #00ff88; color: #000; font-weight: bold; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
    .btn:hover { background: #00cc6a; box-shadow: 0 0 15px rgba(0,255,136,0.4); }

    /* Formulario */
    .form-section { background: #131a26; padding: 25px; border-radius: 12px; border: 1px solid #2a364f; margin-top: 20px; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 6px; color: #9ca3af; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 10px; background: #090d14; border: 1px solid #2a364f; border-radius: 6px; color: #fff; font-size: 1rem; }
    .form-group input:focus { border-color: #00ff88; outline: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="banner">
        <h1>Sorteio de Skins CS2</h1>
        <p>Deposite, envie o comprovante e concorra na roleta ao vivo!</p>
      </div>
    </div>

    <!-- Seção da Roleta -->
    <div class="roulette-section">
      <h2>Roleta de Participantes</h2>
      <div class="roulette-container">
        <div class="pointer pointer-top"></div>
        <div class="pointer pointer-bottom"></div>
        <div class="roulette-track" id="track"></div>
      </div>
      <button class="btn" onclick="rodarRoleta()">Girar Roleta (Ao Vivo)</button>
    </div>

    <!-- Formulario de Inscrição -->
    <div class="form-section">
      <h2>Enviar Comprovante de Depósito</h2>
      <form id="sorteioForm" style="margin-top: 15px;">
        <div class="form-group">
          <label>ID da Plataforma (CSGO.NET / CSCase):</label>
          <input type="text" id="id_plataforma" required placeholder="Ex: 3483201" />
        </div>
        <div class="form-group">
          <label>Valor Depositado (US$):</label>
          <input type="number" step="0.01" id="valor_depositado" required placeholder="Ex: 10.00" />
        </div>
        <div class="form-group">
          <label>Seu Discord:</label>
          <input type="text" id="discord" required placeholder="Ex: MikaelPower_" />
        </div>
        <div class="form-group">
          <label>Seu WhatsApp / Telefone:</label>
          <input type="text" id="telefone" required placeholder="Ex: (11) 90000-0000" />
        </div>
        <div class="form-group">
          <label>Print do Comprovante:</label>
          <input type="file" id="comprovante" accept="image/*" required />
        </div>
        <button type="submit" class="btn" style="width: 100%;">Enviar para Validação</button>
      </form>
    </div>
  </div>

  <script>
    // Configuração do Supabase
    const SUPABASE_URL = "https://utbfvynphldzwyapfuyu.supabase.co";
    const SUPABASE_KEY = "SUA_ANON_KEY_AQUI"; // Cole aqui a chave que começa com ey...
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Dados de exemplo para testar a roleta
    const demoUsers = [
      { name: "MikaelPower", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Mikael" },
      { name: "Ricardo", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Ricardo" },
      { name: "David", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=David" },
      { name: "Mauro", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Mauro" }
    ];

    function montarRoleta() {
      const track = document.getElementById('track');
      track.innerHTML = '';
      for(let i=0; i<15; i++) {
        demoUsers.forEach(u => {
          const card = document.createElement('div');
          card.className = 'user-card';
          card.innerHTML = `<img src="${u.avatar}" /><span>${u.name}</span>`;
          track.appendChild(card);
        });
      }
    }

    function rodarRoleta() {
      const track = document.getElementById('track');
      const cardWidth = 130;
      const winnerIndex = 42;
      const containerWidth = track.parentElement.offsetWidth;
      const targetOffset = (winnerIndex * cardWidth) - (containerWidth / 2) + (cardWidth / 2);
      
      track.style.transform = `translateX(-${targetOffset}px)`;
    }

    montarRoleta();
  </script>
</body>
</html>
