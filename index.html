<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorteios MikaelPower</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0e14; color: #fff; display: flex; flex-direction: column; align-items: center; padding-bottom: 40px; }
    
    .nav-tabs { width: 100%; background: #0f141d; border-bottom: 2px solid #1a2332; display: flex; justify-content: center; padding: 12px 0; overflow-x: auto; }
    .nav-tab { padding: 8px 16px; margin: 0 4px; background: #151d2a; border: 1px solid #222f43; border-radius: 4px; color: #00ff88; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }

    .container { max-width: 900px; width: 100%; padding: 20px; }

    .skin-card { background: #131a26; border: 1px solid #2a364f; border-radius: 12px; padding: 25px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .skin-card h2 { font-size: 1.5rem; color: #fff; text-transform: uppercase; margin-bottom: 15px; }
    .skin-card img { max-width: 320px; width: 100%; height: auto; margin-bottom: 15px; }
    .skin-price { font-size: 2rem; font-weight: bold; color: #00ff88; margin-bottom: 15px; }
    .rules { background: #090d14; padding: 15px; border-radius: 8px; text-align: left; font-size: 0.9rem; color: #9ca3af; border-left: 4px solid #00ff88; }

    .roulette-section { background: #131a26; padding: 20px; border-radius: 12px; border: 1px solid #2a364f; text-align: center; margin-bottom: 25px; }
    .roulette-container { position: relative; width: 100%; height: 130px; overflow: hidden; background: #090d14; border-radius: 8px; border: 2px solid #2a364f; margin: 15px 0; }
    .roulette-track { display: flex; position: absolute; left: 0; top: 10px; transition: transform 5s cubic-bezier(0.15, 0.9, 0.2, 1); }
    .user-card { width: 110px; height: 110px; margin: 0 5px; background: #192231; border-radius: 8px; border: 1px solid #2e3d59; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
    .user-card img { width: 50px; height: 50px; border-radius: 50%; margin-bottom: 6px; border: 2px solid #00ff88; }
    .user-card span { font-size: 0.75rem; font-weight: bold; color: #fff; width: 95px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .pointer { position: absolute; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; z-index: 10; }
    .pointer-top { top: 0; border-top: 12px solid #00ff88; }
    .pointer-bottom { bottom: 0; border-bottom: 12px solid #00ff88; }

    .form-section { background: #131a26; padding: 25px; border-radius: 12px; border: 1px solid #2a364f; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 6px; color: #9ca3af; font-size: 0.85rem; text-transform: uppercase; font-weight: bold; }
    .form-group input { width: 100%; padding: 10px; background: #090d14; border: 1px solid #2a364f; border-radius: 6px; color: #fff; font-size: 1rem; }
    .form-group input:focus { border-color: #00ff88; outline: none; }
    
    .btn { background: #00ff88; color: #000; font-weight: bold; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; text-transform: uppercase; width: 100%; transition: 0.2s; }
    .btn:hover { background: #00cc6a; }
  </style>
</head>
<body>

  <div class="nav-tabs">
    <div class="nav-tab">Sorteio Diário</div>
    <div class="nav-tab">Sorteio CSGONET Mensal</div>
    <div class="nav-tab">Sorteio Contrato</div>
    <div class="nav-tab">LivePix</div>
  </div>

  <div class="container">
    
    <div class="skin-card">
      <h2>Sorteio Diário ★ Bowie Autotronic</h2>
      <img src="https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpotLu8JAllx8zJYQJD_9W7m5O0m_7zO6-FxDxUv8Nz2rGQ9Nn32wO28kVtam6mcdOWclQ9ZgyG-Vi6yefvjJ-6uJ2Yz3Y36XIg4i3amkG0hxlSLrs4z6rOQ9o/360fx360f" alt="Skin" />
      <div class="skin-price">R$ 1.200,00</div>
      <div class="rules">
        <p>⭐ <b>Regra:</b> Deposite no mínimo $1 dólar com o cupom na plataforma parceira para garantir os seus tickets na roleta ao vivo!</p>
      </div>
    </div>

    <div class="roulette-section">
      <h3>Roleta de Participantes</h3>
      <div class="roulette-container">
        <div class="pointer pointer-top"></div>
        <div class="pointer pointer-bottom"></div>
        <div class="roulette-track" id="track"></div>
      </div>
      <button class="btn" style="width: auto; padding: 10px 30px;" onclick="rodarRoleta()">Girar Roleta</button>
    </div>

    <div class="form-section">
      <h3 style="margin-bottom: 15px; color: #00ff88; text-transform: uppercase;">Enviar Comprovante de Depósito</h3>
      <form id="sorteioForm" onsubmit="enviarInscricao(event)">
        <div class="form-group">
          <label>ID da Plataforma:</label>
          <input type="text" id="id_plataforma" required placeholder="Ex: 3483201" />
        </div>
        <div class="form-group">
          <label>Valor Depositado (US$):</label>
          <input type="number" step="0.01" id="valor_depositado" required placeholder="Ex: 10.00" />
        </div>
        <div class="form-group">
          <label>Seu Discord:</label>
          <input type="text" id="discord" required placeholder="Ex: MikaelPower_" />
        </div>
        <div class="form-group">
          <label>Print do Comprovante:</label>
          <input type="file" id="comprovante" accept="image/*" required />
        </div>
        <button type="submit" class="btn" id="btnEnviar">Enviar para Validação</button>
        <div id="feedback" style="margin-top: 10px; text-align: center; font-weight: bold;"></div>
      </form>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://utbfvynphldzwyapfuyu.supabase.co";
    const SUPABASE_KEY = "SUA_ANON_KEY_AQUI";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const demoUsers = [
      { name: "MikaelPower", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Mikael" },
      { name: "Ricardo", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Ricardo" },
      { name: "Lucas", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Lucas" },
      { name: "Renan", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Renan" }
    ];

    function montarRoleta() {
      const track = document.getElementById('track');
      track.innerHTML = '';
      for(let i=0; i<15; i++) {
        demoUsers.forEach(u => {
          const card = document.createElement('div');
          card.className = 'user-card';
          card.innerHTML = `<img src="${u.avatar}" /><span>${u.name}</span>`;
          track.appendChild(card);
        });
      }
    }

    function rodarRoleta() {
      const track = document.getElementById('track');
      const cardWidth = 120;
      const winnerIndex = 42;
      const containerWidth = track.parentElement.offsetWidth;
      const targetOffset = (winnerIndex * cardWidth) - (containerWidth / 2) + (cardWidth / 2);
      track.style.transform = `translateX(-${targetOffset}px)`;
    }

    async function enviarInscricao(event) {
      event.preventDefault();
      const btn = document.getElementById('btnEnviar');
      const feedback = document.getElementById('feedback');
      
      btn.disabled = true;
      btn.innerText = "A enviar...";
      feedback.style.color = "#9ca3af";
      feedback.innerText = "A enviar dados...";

      try {
        const idPlataforma = document.getElementById('id_plataforma').value;
        const valorDepositado = parseFloat(document.getElementById('valor_depositado').value);
        const discord = document.getElementById('discord').value;
        const fileInput = document.getElementById('comprovante');
        const file = fileInput.files[0];

        let comprovanteUrl = "";

        if (file) {
          const fileName = `${Date.now()}_${file.name}`;
          const { error: uploadError } = await _supabase.storage
            .from('comprovantes')
            .upload(fileName, file);

          if (uploadError) throw uploadError;

          const { data: publicURLData } = _supabase.storage
            .from('comprovantes')
            .getPublicUrl(fileName);

          comprovanteUrl = publicURLData.publicUrl;
        }

        const { error: insertError } = await _supabase
          .from('inscricoes')
          .insert([{ 
            id_plataforma: idPlataforma, 
            valor_depositado: valorDepositado, 
            discord: discord, 
            comprovante_url: comprovanteUrl 
          }]);

        if (insertError) throw insertError;

        feedback.style.color = "#00ff88";
        feedback.innerText = "Enviado com sucesso!";
        document.getElementById('sorteioForm').reset();
      } catch (err) {
        console.error(err);
        feedback.style.color = "#ff4444";
        feedback.innerText = "Erro ao enviar. Tenta novamente.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Enviar para Validação";
      }
    }

    montarRoleta();
  </script>
</body>
</html>
